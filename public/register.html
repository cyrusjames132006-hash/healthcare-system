<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MediCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: #f4f7f6; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
        }
        .reg-card { 
            width: 100%; 
            max-width: 400px; 
            padding: 30px; 
            border-radius: 15px; 
            background: #fff; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
    </style>
</head>
<body>
    <div class="reg-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-user-plus text-success fa-3x mb-2"></i>
            <h4 class="fw-bold">Create Account</h4>
            <small class="text-muted">Register as a user</small>
        </div>
        <div id="alertBox" class="alert d-none"></div>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="username" class="form-control" required placeholder="Choose a username">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control" required placeholder="Choose a password">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold mb-3 shadow-sm">Register</button>
        </form>
        <div class="text-center">
            <small class="text-muted">Already have an account? <a href="login.html" class="text-decoration-none fw-bold text-success">Login here</a></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('d-none');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: password.value
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    alertBox.className = "alert alert-success";
                    alertBox.textContent = data.message || 'Registration successful!';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => window.location.href = '/login.html', 1500);
                } else {
                    alertBox.className = "alert alert-danger";
                    alertBox.textContent = data.error || 'Registration failed';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = "alert alert-danger";
                alertBox.textContent = 'Connection error. Please try again.';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
